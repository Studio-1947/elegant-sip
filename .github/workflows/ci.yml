name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Typecheck, lint and the pure unit tests. No services needed, so this gives
  # fast feedback on the majority of mistakes.
  static:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --workspace @elegantsip/web
      - name: Money and phone rules
        run: npm test --workspace @elegantsip/shared
      - name: Storefront components
        run: npm test --workspace @elegantsip/web
      # Known-vulnerable production dependencies (high or critical). Advisory
      # only for now — the dependency upgrades are being done separately —
      # so a finding shows as a warning on the run without failing it. Remove
      # `continue-on-error` once `npm audit` is clean to make it a real gate.
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

  # The API against real Postgres and Redis. Containers rather than mocks,
  # because the things worth testing here — transactions, row locks, unique
  # constraints doing idempotency — do not exist in a mock.
  api:
    name: API integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elegantsip
          POSTGRES_PASSWORD: elegantsip
          POSTGRES_DB: elegantsip
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U elegantsip -d elegantsip"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://elegantsip:elegantsip@localhost:5432/elegantsip
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      PAYMENT_PROVIDER: fake
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test --workspace @elegantsip/api

  # The OpenAPI document is generated from the same Zod schemas that validate
  # requests. This job regenerates it and fails if the committed copy differs,
  # so an API change without a docs change is a red build — the docs cannot
  # silently go stale.
  openapi:
    name: OpenAPI spec is current
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elegantsip
          POSTGRES_PASSWORD: elegantsip
          POSTGRES_DB: elegantsip
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U elegantsip -d elegantsip"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://elegantsip:elegantsip@localhost:5432/elegantsip
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run openapi:emit --workspace @elegantsip/api
      - name: Fail if the spec drifted
        run: |
          if ! git diff --quiet -- apps/api/openapi.json; then
            echo "::error::openapi.json is out of date. Run 'npm run openapi:emit --workspace @elegantsip/api' and commit the result."
            git diff -- apps/api/openapi.json
            exit 1
          fi
          echo "OpenAPI spec matches the code."

  # Builds the storefront and audits the built output the way a crawler sees
  # it — the checks are worthless against the dev server.
  web:
    name: Storefront build · SEO audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspace @elegantsip/web
      - run: npm test --workspace @elegantsip/web
      - name: SEO audit
        run: |
          npm run serve:dist --workspace @elegantsip/web &
          npx wait-on http://localhost:4500 --timeout 30000
          npm run seo:check --workspace @elegantsip/web

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            dockerfile: apps/api/Dockerfile
          - name: Storefront
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
