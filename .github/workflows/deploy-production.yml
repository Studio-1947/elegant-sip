name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A push deploys only after its CI workflow succeeds. Manual dispatch is
    # retained for a deliberate rebuild of the currently selected revision.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Load deployment key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Trust the VPS host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.VPS_SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested revision
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /var/www/elegant-sip
          git fetch --prune origin main
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          git checkout --detach "$DEPLOY_SHA"

          # A dump of the live database before the new release migrates it, so a
          # bad migration can be rolled back. Kept apart from the nightly dumps
          # (the newest 5), and a failed dump stops the deploy before anything changes.
          if docker compose -f docker-compose.prod.yml ps --status running --services | grep -qx backup; then
            docker compose -f docker-compose.prod.yml exec -T backup sh -c '
              set -e
              umask 077
              mkdir -p /backups/predeploy
              file="/backups/predeploy/elegantsip-$(date +%Y-%m-%d-%H%M%S).dump"
              pg_dump --no-owner --format=custom --file="$file"
              echo "pre-deploy backup: $file"
              ls -1t /backups/predeploy/*.dump | tail -n +6 | xargs -r rm -f
            '
          else
            echo "backup service not running (first deploy?): skipping the pre-deploy dump"
          fi

          docker compose -f docker-compose.prod.yml up -d --build
          docker compose -f docker-compose.prod.yml ps

          # A deploy is done when the API answers /ready (database reachable,
          # migrations applied), not when the containers have merely started.
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T api               node -e "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "API ready"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become ready within 150 s"
          docker compose -f docker-compose.prod.yml logs --tail=100 api
          exit 1
          REMOTE
