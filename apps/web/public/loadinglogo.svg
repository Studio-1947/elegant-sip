<svg width="2914" height="2703" viewBox="0 0 2914 2703" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  /*
   * Draw-in reveal. The outer silhouette is one closed loop, so tracing it
   * with a stroke-dash reveal starts and ends at the exact same point (its
   * opening M). The inner detail (leaf, hills, handle) then appears the
   * same way, as thin strokes rather than a fill, because the finished
   * icon gets its line-art look from nonzero-winding cancellation between
   * ALL of the original subpaths together — splitting them into separate
   * filled shapes breaks that cancellation. So the true, correct render is
   * one path with the untouched original data (.es-final), which simply
   * fades in under the strokes once they have finished.
   */
  .es-outline {
    fill: none;
    stroke: url(#paint0_linear_29_106);
    stroke-width: 16;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation:
      es-draw 1.1s cubic-bezier(.65, 0, .35, 1) forwards,
      es-stroke-out 0.5s ease-out 1.3s forwards;
  }
  .es-detail {
    fill: none;
    stroke: url(#paint0_linear_29_106);
    stroke-width: 16;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-opacity: 0;
    animation:
      es-stroke-in 0.5s ease-out 1s forwards,
      es-stroke-out 0.5s ease-out 1.3s forwards;
  }
  .es-final {
    fill: url(#paint0_linear_29_106);
    fill-opacity: 0;
    animation: es-final-in 0.6s ease-out 1.3s forwards;
  }
  @keyframes es-draw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes es-stroke-in {
    to { stroke-opacity: 1; }
  }
  @keyframes es-stroke-out {
    to { stroke-opacity: 0; }
  }
  @keyframes es-final-in {
    to { fill-opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .es-outline, .es-detail { animation: none; stroke-opacity: 0; }
    .es-final { animation: none; fill-opacity: 1; }
  }
</style>
