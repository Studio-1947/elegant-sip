  <!-- Favicon and app icons (the cup mark). favicon.ico also serves /favicon.ico requests. -->

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="alternate" type="application/rss+xml" title="The Elegant Sip Journal" href="/rss.xml" />

  <!-- LCP posters: discovered in the HTML instead of after the JS boots. -->
  <link rel="preload" as="image" href="/cover_elegant-poster.webp" media="(min-width: 1024px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/mobile-poster.webp" media="(max-width: 1023px)" fetchpriority="high" />

  <!-- Fonts load without blocking the first paint. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&family=Inter:wght@400..700&display=swap" />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&family=Inter:wght@400..700&display=swap"

    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&family=Inter:wght@400..700&display=swap"
      rel="stylesheet" />
  </noscript>

      "sameAs": [

        "https://www.facebook.com/profile.php?id=61586479127169",
        "https://wa.me/917583995294"

    }
